# navigation-api-fixtures: replays the navigation-api@v1 fixtures against a
# stand-in of nidana_dart_navigation that implements the contract's
# Interface, on the stand-in runtime of ../bus-testing-fixtures/, and binds
# the executor suite under testWidgets to a minimal stand-in Flutter router
# on a production-provider bus (see run.sh). Its own pub workspace, never a
# member of the repository's workspace.
name: naf_root
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - packages/nidana_dart_contracts
  - packages/nidana_contract_check
  - packages/nidana_dart_runtime
  - packages/nidana_dart_navigation
  - packages/flutter_navigation_standin
dev_dependencies:
  lints: ^6.1.0
