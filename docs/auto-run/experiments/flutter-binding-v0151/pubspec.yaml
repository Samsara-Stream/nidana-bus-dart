# flutter-binding-v0151: S63 (hsdd-contract, H6 of the v0.15.1 intake)
# replays flutter-binding's two bindings, before and after this step, on the
# stand-in runtimes of ../bus-api-v2/ (a bus-api@v1 runtime and a bus-api@v2
# runtime) and on two stand-in adapters (flutter-binding@v1 as amended, and
# v2 with NidanaModule); probes the Flutter facts NidanaModule rests on (see
# run.sh). Its own pub workspace, never a member of the repository's
# workspace.
name: fb0151_root
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - packages/nidana_dart_contracts
  - packages/nidana_contract_check
  - packages/nidana_dart_runtime
  - packages/nidana_dart_navigation
  - packages/nidana_dart_runtime_flutter
dev_dependencies:
  lints: ^6.1.0
