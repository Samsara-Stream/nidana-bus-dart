# go_router probe for OQ-F1: a standalone Flutter package with its own
# resolution, apart from the stand-in workspace, so that go_router's
# dependencies never enter it.
name: gorouter_probe
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
