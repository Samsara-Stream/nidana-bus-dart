<title>Nidana Planning Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* Layout: a run plotted top-down. Header and breadcrumb, one layer at a time in the main column,
   evidence opens in a drawer on the right (full screen on a phone). */
:root {
  --paper: #f4f6f5; --panel: #ffffff; --sunk: #eaeeec; --ink: #18211f; --muted: #5a6763; --rule: #d3dad7;
  --accent: #0e6a70; --accent-ink: #ffffff;
  --ln-orch: #3d4fb8; --ln-sub: #0b7a6c; --ln-skill: #a8620b; --ln-ws: #5b6670; --ln-git: #a33a59;
  --sk-spec: #0b7a6c; --sk-adr: #a8620b; --sk-contract: #3d4fb8; --sk-plan: #4d7a1f; --sk-reconcile: #a33a59; --sk-intake: #7b3fa6; --sk-none: #5b6670;
  --b-node: #7b8784; --b-contract: #2f63b5; --b-tree: #b5770b; --b-up: #b8352f;
  --add: #dff3e4; --add-ink: #1d6b34; --del: #fbe3e1; --del-ink: #9b2c24;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111716; --panel: #182120; --sunk: #0d1312; --ink: #e2e9e6; --muted: #93a29d; --rule: #2a3532;
  --accent: #4fb3b8; --accent-ink: #0b1414;
  --ln-orch: #8d9bf0; --ln-sub: #47c2ae; --ln-skill: #e3a447; --ln-ws: #9aa6b0; --ln-git: #e57b99;
  --sk-spec: #47c2ae; --sk-adr: #e3a447; --sk-contract: #8d9bf0; --sk-plan: #9ccc5f; --sk-reconcile: #e57b99; --sk-intake: #c39ae8; --sk-none: #9aa6b0;
  --b-node: #8f9b98; --b-contract: #78a6f0; --b-tree: #e6ac45; --b-up: #f07a72;
  --add: #15301e; --add-ink: #8fdca4; --del: #3a1a18; --del-ink: #f2a39b;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #111716; --panel: #182120; --sunk: #0d1312; --ink: #e2e9e6; --muted: #93a29d; --rule: #2a3532;
  --accent: #4fb3b8; --accent-ink: #0b1414;
  --ln-orch: #8d9bf0; --ln-sub: #47c2ae; --ln-skill: #e3a447; --ln-ws: #9aa6b0; --ln-git: #e57b99;
  --sk-spec: #47c2ae; --sk-adr: #e3a447; --sk-contract: #8d9bf0; --sk-plan: #9ccc5f; --sk-reconcile: #e57b99; --sk-intake: #c39ae8; --sk-none: #9aa6b0;
  --b-node: #8f9b98; --b-contract: #78a6f0; --b-tree: #e6ac45; --b-up: #f07a72;
  --add: #15301e; --add-ink: #8fdca4; --del: #3a1a18; --del-ink: #f2a39b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--f-mono); font-size: .86em; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; margin: 0; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 10px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font-size: 1.15rem; font-weight: 700; }
.brand span { color: var(--muted); font-size: .8rem; }
.tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: .85rem; color: var(--muted); padding-block: 12px 4px; }
.crumbs button { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--accent); border-radius: 4px; }
.crumbs .sep { opacity: .5; }
main { padding-block: 8px 64px; }
section.block { margin-top: 26px; }
section.block > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
section.block > header p { margin: 0; color: var(--muted); font-size: .9rem; max-width: 70ch; }
.lede { max-width: 72ch; color: var(--ink); margin: 6px 0 0; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }

/* facts line */
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); }
.facts div { display: flex; flex-direction: column; min-width: 0; }
.facts b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts span { color: var(--muted); font-size: .76rem; letter-spacing: .03em; text-transform: uppercase; }

/* actor diagram */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.actors { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px; }
.actors svg { display: block; width: 100%; min-width: 760px; height: auto; }
.actors .box { cursor: pointer; }
.actors .box rect { fill: var(--panel); stroke: var(--rule); stroke-width: 1.2; }
.actors .box:hover rect, .actors .box:focus rect { stroke: var(--accent); stroke-width: 2; }
.actors .box .t { font: 600 14px var(--f-display); fill: var(--ink); }
.actors .box .s { font: 11.5px var(--f-body); fill: var(--muted); }
.actors .box .band { stroke: none; }
.actors .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.actors .edge.dash { stroke-dasharray: 4 4; }
.actors .el { font: 11px var(--f-body); fill: var(--muted); }
.actors marker path { fill: var(--muted); }
.protocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 18px; margin: 12px 0 0; padding: 0; list-style: none; counter-reset: p; }
.protocol li { counter-increment: p; padding-left: 30px; position: relative; font-size: .9rem; }
.protocol li::before { content: counter(p); position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: var(--sunk); color: var(--muted); font: 600 .75rem/21px var(--f-mono); text-align: center; }

/* stage spine */
.spine { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 26px; }
.spine::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.spine .node { position: relative; }
.spine .node::before { content: ""; position: absolute; left: -22px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.spine .node.end::before { background: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card.click { cursor: pointer; text-align: left; width: 100%; display: block; }
.card.click:hover { border-color: var(--accent); }
.stagehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.stagehead .num { font: 500 .78rem var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.stagehead .meta { margin-left: auto; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.card p { margin: 6px 0 0; font-size: .9rem; color: var(--muted); max-width: 90ch; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 1px 9px; font: 500 .76rem var(--f-mono); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.chip.flag { border-color: transparent; background: var(--sunk); cursor: default; }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 0 6px; font: 500 .72rem/1.6 var(--f-mono); background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.c { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }

/* timeline strip */
.timeline { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px 6px; }
.timeline svg { display: block; width: 100%; min-width: 760px; height: auto; }
.timeline rect.step { cursor: pointer; }
.timeline rect.step:hover { stroke: var(--ink); stroke-width: 1; }
.timeline text { font: 10.5px var(--f-mono); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

/* step flow (stage view) */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow .arrow { height: 18px; margin-left: 28px; border-left: 2px solid var(--rule); }
.stepcard { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; }
.stepcard .ref { font: 600 1.05rem var(--f-mono); }
.stepcard .ref small { display: block; font: 500 .7rem var(--f-mono); color: var(--muted); margin-top: 2px; }
.stepcard .tgt { font-weight: 500; }
.stepcard .side { text-align: right; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.blastbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--sunk); max-width: 260px; }
.blastbar i { display: block; height: 100%; background: var(--c); }
.learned { margin-top: 8px; font-size: .84rem; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 10px; }
@media (max-width: 640px) { .stepcard { grid-template-columns: 52px minmax(0, 1fr); } .stepcard .side { grid-column: 2; text-align: left; } }

/* step header */
.stephead { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
.stephead h2 { font-size: 1.5rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 18px; margin-top: 12px; }
.kv div { min-width: 0; }
.kv span { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
.kv b { font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* sequence diagram */
.seqtools { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 10px 0 8px; font-size: .86rem; color: var(--muted); }
.seqtools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.seq { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); max-height: 78vh; overflow: auto; }
.seq .inner { min-width: 760px; }
.seq .lanes, .seq .row { display: grid; grid-template-columns: 52px repeat(5, minmax(0, 1fr)); }
.seq .lanes { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--rule); z-index: 3; }
.seq .lanes div { padding: 8px 4px; text-align: center; font: 600 .78rem var(--f-display); letter-spacing: .02em; color: var(--c); }
.seq .lanes div small { display: block; font: 400 .7rem var(--f-body); color: var(--muted); }
.seq .row { position: relative; min-height: 30px; align-items: center; }
.seq .row .tm { grid-row: 1; grid-column: 1; font: .7rem var(--f-mono); color: var(--muted); padding-left: 8px; font-variant-numeric: tabular-nums; }
.seq .row .ln { grid-row: 1; align-self: stretch; position: relative; }
.seq .row .ln::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--rule); }
.seq .msg { grid-row: 1; position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; min-width: 0; cursor: pointer; padding: 3px 0; border: 0; background: none; text-align: center; }
.seq .msg .line { position: absolute; left: calc(100% / (2 * var(--k))); right: calc(100% / (2 * var(--k))); top: 50%; border-top: 1.6px solid var(--c); }
.seq .msg .line::after { content: ""; position: absolute; right: -2px; top: -5.3px; border-left: 8px solid var(--c); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.seq .msg.rev .line::after { right: auto; left: -2px; border-left: 0; border-right: 8px solid var(--c); }
.seq .msg .lbl { position: relative; background: var(--panel); padding: 0 7px; font-size: .8rem; line-height: 1.35; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.seq .msg:hover .lbl { color: var(--accent); }
.seq .self { grid-row: 1; z-index: 1; display: flex; align-items: center; min-width: 0; cursor: pointer; border: 0; background: none; padding: 3px 6px 3px 0; text-align: left; margin-left: calc(50% / var(--k1, 1) - 5px); }
.seq .self .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; margin-right: 7px; box-shadow: 0 0 0 3px var(--panel); }
.seq .self .lbl { font-size: .8rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--panel); padding-right: 6px; }
.seq .self.dec .dot { border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
.seq .self.dec .lbl { font-weight: 500; }
.seq .self.note .lbl { font-style: italic; color: var(--muted); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.seq .self:hover .lbl { color: var(--accent); }
.seq .band { grid-column: 1 / -1; padding: 6px 10px; background: var(--sunk); font: 600 .74rem var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-block: 1px solid var(--rule); }
.seq .wide { grid-column: 2 / -1; grid-row: 1; z-index: 1; margin: 4px 8px; padding: 3px 10px; border-radius: 4px; background: color-mix(in srgb, var(--b-tree) 16%, transparent); font-size: .8rem; text-align: center; }
.seq .err { color: var(--b-up); }

/* lists and tables */
.list { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.list > button, .list > div.item { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 2px 12px; text-align: left; padding: 9px 12px; border: 0; border-top: 1px solid var(--rule); background: none; cursor: pointer; }
.list > :first-child { border-top: 0; }
.list > button:hover { background: var(--sunk); }
.list .id { font: 500 .8rem var(--f-mono); color: var(--accent); padding-top: 1px; }
.list .q { min-width: 0; }
.list .q .ch { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.list .q .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.files { display: flex; flex-direction: column; gap: 4px; }
.fileline { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); font-size: .86rem; }
.fileline .p { font-family: var(--f-mono); font-size: .8rem; min-width: 0; overflow-wrap: anywhere; margin-right: auto; }
.fileline .n { font: .75rem var(--f-mono); font-variant-numeric: tabular-nums; }
.fileline .n .a { color: var(--add-ink); } .fileline .n .d { color: var(--del-ink); }
.linkbtn { border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 1px 8px; font-size: .78rem; cursor: pointer; }
.linkbtn:hover { border-color: var(--accent); color: var(--accent); }
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--rule); margin-top: 24px; }
.subtabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding-top: 14px; }
table.t { border-collapse: collapse; width: 100%; font-size: .85rem; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t th { font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .03em; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 14px 0; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); color: var(--ink); font: inherit; }
.filters select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); color: var(--ink); font: inherit; font-size: .88rem; }
.filters label { display: inline-flex; gap: 5px; align-items: center; font-size: .86rem; color: var(--muted); cursor: pointer; }

/* tree */
.tree { display: flex; flex-direction: column; gap: 6px; }
.tree .tn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; margin-left: calc(var(--d) * 26px); position: relative; }
.tree .tn::before { content: ""; position: absolute; left: -16px; top: -6px; width: 12px; height: 24px; border-left: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); border-bottom-left-radius: 4px; display: var(--branch, block); }
.tree .tn .nm { font: 600 .92rem var(--f-mono); }
.tree .tn .nm small { font: 400 .78rem var(--f-body); color: var(--muted); margin-left: 8px; }
.tree .tn .ph { font: .78rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .28); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--panel); z-index: 41; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgb(0 0 0 / .18); border-left: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer > header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.drawer > header h3 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer > header button { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.drawer .body { overflow: auto; padding: 14px 18px 40px; flex: 1; min-width: 0; }
.drawer .body h4 { font: 600 .74rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
.opt { border: 1px solid var(--rule); border-radius: var(--r); padding: 8px 10px; margin-top: 6px; font-size: .9rem; }
.opt.chosen { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.opt b { display: block; }
.opt .cq { color: var(--muted); font-size: .86rem; }
.banner { border-radius: var(--r); padding: 8px 12px; font-size: .86rem; background: color-mix(in srgb, var(--b-tree) 15%, transparent); margin-top: 10px; }
pre.code, pre.diff { font: .76rem/1.5 var(--f-mono); background: var(--sunk); border-radius: var(--r); padding: 10px 12px; overflow: auto; white-space: pre; max-height: 70vh; margin: 6px 0; }
pre.wrapit { white-space: pre-wrap; overflow-wrap: anywhere; }
pre.diff .a { background: var(--add); color: var(--add-ink); display: block; }
pre.diff .d { background: var(--del); color: var(--del-ink); display: block; }
pre.diff .h { color: var(--accent); display: block; }
.md { font-size: .9rem; line-height: 1.6; overflow-wrap: anywhere; }
.md h1 { font-size: 1.3rem; margin: 18px 0 8px; } .md h2 { font-size: 1.12rem; margin: 18px 0 6px; } .md h3, .md h4 { font-size: .98rem; margin: 14px 0 6px; }
.md pre { font: .76rem/1.5 var(--f-mono); background: var(--sunk); padding: 10px; border-radius: var(--r); overflow: auto; }
.md code { background: var(--sunk); padding: 0 3px; border-radius: 3px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: .82rem; }
.md th, .md td { border: 1px solid var(--rule); padding: 4px 7px; text-align: left; vertical-align: top; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }
.md .hit { background: color-mix(in srgb, var(--b-tree) 30%, transparent); border-radius: 3px; }
.ev-link { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.loading { padding: 40px 0; color: var(--muted); }
.notice { padding: 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); margin-top: 20px; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<div class="top"><div class="wrap">
  <div class="brand"><h1>Nidana Planning Run</h1><span id="sub">loading the run record</span></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-process" aria-selected="true" data-tab="process">Process</button>
    <button role="tab" id="tab-artifacts" aria-selected="false" data-tab="artifacts">Artifacts</button>
    <button role="tab" id="tab-decisions" aria-selected="false" data-tab="decisions">Decisions</button>
  </div>
</div></div>
<div class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <main id="view"><div class="loading">Loading the run record...</div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dr-title">
  <header><button id="dr-back" title="Back" hidden>Back</button><h3 id="dr-title"></h3><button id="dr-close">Close</button></header>
  <div class="body" id="dr-body"></div>
</aside>

<script>
"use strict";
const S = { core: null, full: null, files: {}, exps: null, steps: {}, tab: "process", view: { kind: "run" },
  narr: false, compress: true, dstack: [], decFilter: { q: "", b: "", c: "", st: "", w: false, u: false, o: false } };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const SKILLS = { "hsdd-spec": "--sk-spec", "hsdd-adr": "--sk-adr", "hsdd-contract": "--sk-contract", "hsdd-phase-plan": "--sk-plan", "hsdd-reconcile": "--sk-reconcile", "hsdd-intake": "--sk-intake", none: "--sk-none" };
const BLAST = { "node-local": "--b-node", contract: "--b-contract", tree: "--b-tree", upstream: "--b-up" };
const skillVar = (s) => `var(${SKILLS[s] || "--sk-none"})`;
const blastVar = (b) => `var(${BLAST[b] || "--b-node"})`;
const LANES = [["orch", "Orchestrator", "main session", "--ln-orch"], ["sub", "Step subagent", "fresh context", "--ln-sub"],
  ["skill", "HSDD skill", "instructions", "--ln-skill"], ["ws", "Workspace", "files, fvm, gate", "--ln-ws"], ["git", "Git and ledger", "commits, jsonl", "--ln-git"]];
const LI = Object.fromEntries(LANES.map((l, i) => [l[0], i]));

async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " returned " + r.status); return r.json(); }
async function full() { if (!S.full) { const a = await getJSON("data/decisions.json"); S.full = Object.fromEntries(a.map((d) => [d.id, d])); } return S.full; }
async function stepData(ref) { if (!S.steps[ref]) S.steps[ref] = await getJSON(`data/steps/${ref}.json`); return S.steps[ref]; }
function bundleOf(p) { if (p.startsWith("ref/") || p.startsWith(".agents/")) return "files-ref.json"; if (p.startsWith("hsdd/") && !p.endsWith(".md")) return "files-fixture.json"; return "files-gov.json"; }
async function fileText(p) { const b = bundleOf(p); if (!S.files[b]) S.files[b] = await getJSON("data/" + b); return S.files[b][p]; }
async function exps() { if (!S.exps) S.exps = await getJSON("data/experiments.json"); return S.exps; }

const tms = (t) => (t ? Date.parse(t) : NaN);
function dur(a, b) { const m = Math.round((tms(b) - tms(a)) / 60000); if (!isFinite(m)) return ""; return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`; }
const hhmm = (t) => (t ? t.slice(11, 16) : "");
const day = (t) => { if (!t) return ""; const d = new Date(t); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) + " " + hhmm(t) + " UTC"; };
const num = (n) => (n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
const durMs = (ms) => dur(new Date(0).toISOString(), new Date(ms).toISOString());
const activeMs = () => S.core.run.segments.reduce((a, g) => a + tms(g.end) - tms(g.start), 0);
const stepBy = (ref) => S.core.steps.find((s) => s.ref === ref);
const segOf = (ref) => S.core.run.segments[stepBy(ref)?.seg ?? S.core.run.segments.length - 1];
const decsOf = (ref) => S.core.decisions.filter((d) => d.s === ref);

/* ---------- linkify evidence and prose ---------- */
const CONTRACTS = () => Object.keys(S.core.history).filter((p) => /^hsdd\/contract\/[^/]+\.md$/.test(p) && !p.endsWith("INDEX.md")).map((p) => p.slice("hsdd/contract/".length, -3));
let LINK_RX = null;
function linkify(text) {
  let s = esc(text);
  const slugs = CONTRACTS().join("|");
  const rx = LINK_RX || (LINK_RX = new RegExp([
    "(docs/auto-run/experiments/[\\w.@+-]+(?:/[\\w./@+-]*)?)",
    "((?:hsdd|docs/auto-run)/[\\w./-]+\\.(?:md|json|dart|yaml|mjs))",
    "\\b(DEC-\\d{3,4})\\b",
    "\\b(ADR-00\\d)\\b",
    slugs ? `\\b((?:${slugs})@v\\d+)\\b` : "(?!x)x",
    "\\b((?:Spec|Guide|Rationale) (?:§\\s?[\\d.]+[a-z]?|Appendix [A-Z](?:\\.\\d+)*))",
    "\\b(S\\d\\d)\\b",
  ].join("|"), "g"));
  rx.lastIndex = 0;
  return s.replace(rx, (m, exp, path, dec, adr, con, ref, step) => {
    if (exp) return `<span class="ev-link" data-exp="${esc(exp)}">${m}</span>`;
    if (path) return `<span class="ev-link" data-file="${esc(path)}">${m}</span>`;
    if (dec) return `<span class="ev-link" data-dec="${dec}">${m}</span>`;
    if (adr) { const p = Object.keys(S.core.history).find((f) => f.startsWith("hsdd/adr/" + adr.slice(4))); return p ? `<span class="ev-link" data-file="${p}">${m}</span>` : m; }
    if (con) return `<span class="ev-link" data-file="hsdd/contract/${con.replace(/@v\d+$/, "")}.md">${m}</span>`;
    if (ref) return `<span class="ev-link" data-ref="${esc(ref)}">${m}</span>`;
    if (step && stepBy(step)) return `<span class="ev-link" data-step="${step}">${m}</span>`;
    return m;
  });
}
document.addEventListener("click", async (e) => {
  const pa = e.target.closest("[data-preamble]");
  if (pa) { e.preventDefault(); openPreamble(+pa.dataset.preamble); return; }
  const x = e.target.closest("[data-diff],[data-step-prompt],[data-report]");
  if (x) {
    e.preventDefault();
    const ref = x.dataset.dref || x.dataset.stepPrompt;
    const b = await stepData(ref);
    if (x.dataset.diff) openDiff(ref, b, x.dataset.diff);
    else if (x.dataset.stepPrompt) openDrawer(`${ref} step prompt`, `<div class="md">${md(b.prompt || "")}</div>`);
    else openDrawer(x.dataset.report, `<pre class="code">${esc(JSON.stringify(b.reports[x.dataset.report], null, 2))}</pre>`);
    return;
  }
  const t = e.target.closest("[data-exp],[data-file],[data-dec],[data-ref],[data-step],[data-stage]");
  if (!t || t.closest(".tabs")) return;
  if (t.dataset.dec) { e.preventDefault(); openDecision(t.dataset.dec); }
  else if (t.dataset.file) { e.preventDefault(); openFile(t.dataset.file, t.dataset.anchor); }
  else if (t.dataset.exp) { e.preventDefault(); openExperiment(t.dataset.exp); }
  else if (t.dataset.ref) { e.preventDefault(); openRef(t.dataset.ref, t.dataset.ver); }
  else if (t.dataset.step) { e.preventDefault(); closeDrawer(); go({ kind: "step", ref: t.dataset.step }, "process"); }
  else if (t.dataset.stage) { e.preventDefault(); closeDrawer(); go({ kind: "stage", id: +t.dataset.stage }, "process"); }
});

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.getAttribute && t.getAttribute("role") === "button" && t.tagName !== "BUTTON" && t.tagName !== "g") { e.preventDefault(); t.click(); }
});

/* ---------- navigation ---------- */
function go(view, tab) {
  if (tab) S.tab = tab;
  S.view = view || S.view;
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === S.tab));
  const token = S.tab !== "process" ? S.tab : S.view.kind === "step" ? S.view.ref : S.view.kind === "stage" ? "stage" + S.core.stages[S.view.id].label : "";
  try { history.replaceState(null, "", token ? "#" + token : location.pathname + location.search); } catch (_) {}
  render();
  window.scrollTo({ top: 0 });
}
for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => go(b.dataset.tab === "process" ? S.view : null, b.dataset.tab));
function crumbs() {
  const c = $("#crumbs"); const parts = [];
  if (S.tab === "process") {
    parts.push(["The run", { kind: "run" }]);
    if (S.view.kind === "stage" || S.view.kind === "step") {
      const id = S.view.kind === "stage" ? S.view.id : stepBy(S.view.ref).stage;
      parts.push([`Stage ${S.core.stages[id].label}: ${S.core.stages[id].title}`, { kind: "stage", id }]);
    }
    if (S.view.kind === "step") parts.push([S.view.ref, S.view]);
  } else parts.push([S.tab === "artifacts" ? "Artifacts" : "Decisions", null]);
  c.innerHTML = "";
  parts.forEach(([label, v], i) => {
    if (i) c.insertAdjacentHTML("beforeend", '<span class="sep">/</span>');
    const b = document.createElement("button"); b.textContent = label;
    if (v && i < parts.length - 1) b.onclick = () => go(v); else { b.disabled = true; b.style.color = "var(--ink)"; b.style.cursor = "default"; }
    c.append(b);
  });
}
function render() {
  S.refVer = null;
  crumbs();
  const v = $("#view");
  if (S.tab === "artifacts") return viewArtifacts(v);
  if (S.tab === "decisions") return viewDecisions(v);
  if (S.view.kind === "stage") return viewStage(v, S.view.id);
  if (S.view.kind === "step") return viewStep(v, S.view.ref);
  return viewRun(v);
}

/* ---------- layer 0: the run ---------- */
function viewRun(v) {
  const c = S.core, r = c.run, st = c.steps, segs = r.segments;
  const subs = st.filter((s) => s.sub).length;
  const exps = new Set(st.flatMap((s) => s.experiments)).size;
  const byOrch = c.decisions.filter((d) => d.by === "orchestrator").length;
  const asked = c.decisions.filter((d) => d.w).length;
  const idle = segs.slice(1).map((g, i) => Math.round((tms(g.start) - tms(segs[i].end)) / 36e5));
  v.innerHTML = `
  <h2>The run, top down</h2>
  <p class="lede">An orchestrator session took the owner's kickoff prompt and planned the repository from nothing to reconciled phase plans. Two days later the owner moved the reference architecture to v0.15.1, and the same session routed that change through hsdd-intake and re-planned what it touched. The orchestrator never ran an HSDD skill itself: every step was one skill run by a fresh subagent, then gated, committed, and recorded in the decision ledger. Start with the actors, pick a stage, then a step. Every decision, file and experiment opens on the right.</p>
  <div class="facts">
    <div><b>${st.length}</b><span>steps</span></div>
    <div><b>${subs}</b><span>subagent runs</span></div>
    <div><b>${c.decisions.length}</b><span>decisions (${byOrch} by orchestrator)</span></div>
    <div><b>${exps}</b><span>experiments</span></div>
    <div><b>${durMs(activeMs())}</b><span>wall clock, ${segs.length} segments</span></div>
    <div><b>0</b><span>stops (${Object.keys(c.run_stop_candidates).length} candidates judged)</span></div>
    <div><b>${asked}</b><span>would have asked</span></div>
    <div><b>${num((r.usage.sub_output_tokens || 0) + (r.usage.orch_output_tokens || 0))}</b><span>output tokens</span></div>
  </div>
  <section class="block"><header><h3>Who does what</h3><p>Click a box for what it is and the files behind it.</p></header>
    <div class="actors scroll-x">${actorSVG()}</div>
    <ol class="protocol">
      <li>The orchestrator writes the step prompt: the shared preamble plus the step's own section.</li>
      <li>A fresh subagent invokes exactly one HSDD skill on one node, contract or ADR.</li>
      <li>It reads sources, runs experiments through fvm, decides, writes artifacts and a step report.</li>
      <li>A skill stop or a run-stop condition ends its turn and goes back to the orchestrator.</li>
      <li>The orchestrator runs gate.mjs and reads the artifacts against the skill's quality gates.</li>
      <li>Commit one: <code>hsdd: Snn</code> with the artifacts and experiments.</li>
      <li>Decisions go to the ledger with that sha; commit two: <code>judgement: Snn</code>.</li>
      <li>From S55 the orchestrator decides what used to stop the run and records it as would have asked (${linkify("DEC-686")}).</li>
    </ol>
  </section>
  <section class="block"><header><h3>Stages</h3><p>The sequence of the run, in ${segs.length} segments, each opened by an owner message. Open a stage for its step flow, or jump straight to a step.</p></header>
    <div class="spine">
      ${segs.map((g, gi) => segCard(g, gi, true) + c.stages.filter((sg) => sg.seg === gi).map(stageCard).join("") + segCard(g, gi, false)).join("")}
    </div>
  </section>
  <section class="block"><header><h3>Wall clock</h3><p>Each bar is one step, coloured by skill. The dashed line is the context summary the orchestrator resumed from. The break between segments hides ${idle.map((h) => h + " idle hours").join(", ")}.</p></header>
    <div class="timeline scroll-x">${timelineSVG()}</div>
    <div class="legend">${Object.entries(SKILLS).map(([k, t]) => `<span><i style="--c:var(${t})"></i>${k === "none" ? "orchestrator only" : k}</span>`).join("")}</div>
  </section>`;
  for (const g of v.querySelectorAll(".actors .box")) {
    g.addEventListener("click", () => openActor(g.dataset.actor));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openActor(g.dataset.actor); } });
  }
  for (const el of v.querySelectorAll("[data-go-stage]")) el.addEventListener("click", (e) => { if (e.target.closest("[data-step],.ev-link")) return; go({ kind: "stage", id: +el.dataset.goStage }); });
  for (const el of v.querySelectorAll("rect.step")) el.addEventListener("click", () => go({ kind: "step", ref: el.dataset.ref }));
}
function segCard(g, gi, opening) {
  const last = gi === S.core.run.segments.length - 1;
  const [title, text] = opening ? g.opened : g.closed;
  const tag = opening ? (gi ? "RESUME" : "START") : (last ? "END" : "PAUSE");
  return `<div class="node${!opening && last ? " end" : ""}"><div class="card"><div class="stagehead"><span class="num">${tag}</span><h3>${esc(title)}</h3>
    <span class="meta">${opening ? esc(g.title) + " &middot; " + day(g.opened_at) : day(g.end)}</span></div>
    <p>${linkify(text)}</p></div></div>`;
}
function stageCard(sg) {
  const steps = sg.steps.map(stepBy).filter(Boolean);
  const nd = steps.reduce((a, s) => a + s.decisions.length, 0);
  const skills = [...new Set(steps.map((s) => s.skill))];
  const start = steps[0].start, end = steps[steps.length - 1].end;
  return `<div class="node"><div class="card click" data-go-stage="${sg.id}" role="button" tabindex="0">
    <div class="stagehead"><span class="num">STAGE ${esc(sg.label)}</span><h3>${esc(sg.title)}</h3>
      <span class="meta">${steps.length} step${steps.length > 1 ? "s" : ""} &middot; ${nd} decisions &middot; ${dur(start, end)}</span></div>
    <p>${linkify(sg.summary)}</p>
    <div class="chips">${steps.map((s) => `<span class="chip" data-step="${s.ref}" title="${esc(s.skill + ": " + s.target)}"><i style="--c:${skillVar(s.skill)}"></i>${s.ref}${s.inserted ? " ↵" : ""}${s.resumed ? " ↻" : ""}</span>`).join("")}</div>
    <div class="chips" style="margin-top:6px">${skills.map((k) => `<span class="tag c" style="--c:${skillVar(k)}">${k === "none" ? "orchestrator" : k}</span>`).join("")}</div>
  </div></div>`;
}
function actorSVG() {
  const box = (id, x, y, w, h, t, s, color) => `<g class="box" data-actor="${id}" tabindex="0" role="button" aria-label="${esc(t)}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7"/><rect class="band" x="${x}" y="${y}" width="5" height="${h}" rx="2" style="fill:var(${color})"/>
    <text class="t" x="${x + 16}" y="${y + 24}">${esc(t)}</text>${s.map((l, i) => `<text class="s" x="${x + 16}" y="${y + 42 + i * 15}">${esc(l)}</text>`).join("")}</g>`;
  const e = (d, label, lx, ly, dash) => `<path class="edge${dash ? " dash" : ""}" d="${d}" marker-end="url(#ah)"/>${label ? `<text class="el" x="${lx}" y="${ly}">${esc(label)}</text>` : ""}`;
  const subs = S.core.steps.filter((s) => s.sub).length, hrs = Math.round(activeMs() / 36e5);
  return `<svg viewBox="0 0 1010 390" role="img" aria-label="Actors of the run and what flows between them">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
  ${box("owner", 44, 20, 170, 78, "Owner", ["kickoff prompt, /goal", "v0.15.1 update request"], "--ln-git")}
  ${box("orch", 292, 20, 210, 78, "Orchestrator", [`main session, ${hrs} h`, "sequences, judges, commits"], "--ln-orch")}
  ${box("sub", 582, 20, 190, 78, `Step subagent × ${subs}`, ["fresh context per step", "one skill, one target"], "--ln-sub")}
  ${box("skill", 836, 20, 160, 78, "HSDD skill", ["spec, adr, contract,", "plan, reconcile, intake"], "--ln-skill")}
  ${box("plan", 44, 160, 170, 64, "Execution plan", ["stages, step log, changes"], "--ln-orch")}
  ${box("gate", 292, 160, 210, 64, "Gate", ["gate.mjs, gen-registry.mjs"], "--ln-ws")}
  ${box("exp", 582, 160, 190, 64, "Experiments", ["throwaway programs via fvm"], "--ln-ws")}
  ${box("hsdd", 836, 160, 160, 64, "hsdd/ artifacts", ["specs, ADRs, contracts,", "intake record"], "--ln-skill")}
  ${box("review", 44, 300, 170, 64, "Reports", ["REPORT.md, then", "REPORT-v0_15_1.md"], "--ln-git")}
  ${box("ledger", 292, 300, 210, 64, "Git and ledger", ["2 commits, decisions.jsonl"], "--ln-git")}
  ${box("report", 582, 300, 190, 64, "Step report", ["steps/Snn.json: decisions"], "--ln-sub")}
  ${e("M214,52 L288,52", "prompt + goal", 218, 44)}
  ${e("M502,44 L578,44", "dispatch", 516, 36)}
  ${e("M582,80 L506,80", "hand-back", 512, 96)}
  ${e("M772,52 L832,52", "invoke", 782, 44)}
  ${e("M916,98 L916,156", "writes", 922, 132)}
  ${e("M677,98 L677,156", "runs", 683, 132)}
  ${e("M590,98 C548,150 548,270 578,318", "writes", 506, 214)}
  ${e("M292,92 C250,120 170,118 129,156", "updates", 232, 132)}
  ${e("M397,98 L397,156", "checks", 403, 132)}
  ${e("M397,224 L397,296", "then commits twice", 403, 262)}
  ${e("M582,332 L506,332", "decisions", 512, 324)}
  ${e("M292,332 L218,332", "builds", 226, 324)}
  ${e("M60,300 C20,250 20,150 60,102", "", 0, 0, true)}<text class="el" transform="rotate(-90 14 200)" x="14" y="200" text-anchor="middle">reviews</text>
  </svg>`;
}
function timelineSVG() {
  // One band per segment, widths in proportion to their durations; the idle time between them is cut out.
  const c = S.core, segs = c.run.segments, W = 1000, GAP = 44;
  const spans = segs.map((g) => [tms(g.start), tms(g.end)]);
  const usable = W - 20 - GAP * (segs.length - 1), total = spans.reduce((a, [p, q]) => a + q - p, 0);
  const offs = []; spans.reduce((x, [p, q]) => { offs.push(x); return x + ((q - p) / total) * usable + GAP; }, 10);
  const Xms = (ms) => { let i = spans.findIndex(([, q]) => ms <= q); if (i < 0) i = spans.length - 1; const [p, q] = spans[i]; return offs[i] + ((Math.min(Math.max(ms, p), q) - p) / total) * usable; };
  const X = (t) => Xms(tms(t));
  const dayOnly = (ms) => new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  let s = `<svg viewBox="0 0 ${W} 112" role="img" aria-label="Steps on the wall clock, one band per segment">`;
  spans.forEach(([p, q], i) => {
    for (let h = Math.ceil(p / 36e5) * 36e5; h <= q; h += 36e5 * 2) { const x = Xms(h); s += `<line x1="${x}" x2="${x}" y1="14" y2="58" stroke="var(--rule)"/><text x="${x}" y="10" text-anchor="middle">${new Date(h).toISOString().slice(11, 16)}</text>`; }
    s += `<text x="${offs[i]}" y="108">${esc(dayOnly(p))}: ${esc(segs[i].title)}</text>`;
    if (i) { const gx = offs[i] - GAP / 2; s += `<path d="M${gx - 6},56 L${gx - 2},16 M${gx + 2},56 L${gx + 6},16" stroke="var(--muted)" fill="none"/><text x="${gx}" y="70" text-anchor="middle">${Math.round((p - spans[i - 1][1]) / 36e5)} h</text>`; }
  });
  for (const st of c.steps) {
    if (!st.start || !st.end) continue;
    const x = X(st.start), w = Math.max(1.5, X(st.end) - x);

    $("#f-n").textContent = `${list.length} of ${S.core.decisions.length} decisions`;
    const shown = list.slice(0, 300);
    $("#f-list").innerHTML = decList(shown.map((d) => ({ id: d.id, question: d.q, chosen: d.ch, b: d.b, c: d.c, w: d.w, u: d.u, s: d.s, sc: d.sc, by: d.by }))) + (list.length > 300 ? `<p class="small muted">Showing the first 300. Narrow the filter to see the rest.</p>` : "");
  };
  for (const id of ["f-q", "f-b", "f-c", "f-st", "f-w", "f-u", "f-o"]) $("#" + id).addEventListener(id === "f-q" ? "input" : "change", apply);
  apply();
}

/* ---------- boot ---------- */
(async function boot() {
  try { S.core = await getJSON("data/core.json"); }
  catch (err) { $("#view").innerHTML = `<div class="notice"><b>The run record did not load.</b><p>${esc(err.message)}. Opened from disk, the page cannot fetch its data folder. Serve the folder instead, for example <code>python3 -m http.server</code> in it, then open <code>local.html</code>.</p></div>`; $("#sub").textContent = "data not loaded"; return; }
  const r = S.core.run;
  $("#sub").textContent = `${r.branch} at ${r.head} · ${day(r.start)} to ${day(r.end)}`;
  const h = (location.hash || "").slice(1);
  if (/^S\d\d$/.test(h) && stepBy(h)) go({ kind: "step", ref: h }, "process");
  else if (S.core.stages.some((sg) => "stage" + sg.label === h)) go({ kind: "stage", id: S.core.stages.find((sg) => "stage" + sg.label === h).id }, "process");
  else if (h === "artifacts" || h === "decisions") go(null, h);
  else if (/^DEC-\d{3,4}$/.test(h)) { go({ kind: "run" }, "process"); openDecision(h); }
  else go({ kind: "run" }, "process");
})();
</script>
